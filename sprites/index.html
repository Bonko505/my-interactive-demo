<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спрайти: стоїть, крокує, біжить (p5.js)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 16px; box-sizing: border-box;
      background: #2b2d42; font-family: sans-serif; color: #edf2f4;
    }
    canvas { border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.35); max-width: 100%; height: auto !important; }
    #ui { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    #ui button {
      font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid #8d99ae; background: #3a3d56; color: #edf2f4;
    }
    #ui button.on { background: #ef8c2d; border-color: #ef8c2d; color: #1b1b1b; }
    #ui button:focus-visible, #ui input:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
    .lbl { font-size: 14px; margin-left: 8px; }
    p { margin: 0; opacity: .8; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <div id="ui"></div>
  <p>1 / 2 / 3 — стояти / крокувати / бігти • Пробіл — стрибок • стрілки — рух • F — фліп • −/+ — масштаб • S — код/PNG • H — hitbox</p>
  <p><a href="../" style="color:#ffd166">← до гри-клацалки</a></p>
  <script src="sketch.js"></script>
</body>
</html>
